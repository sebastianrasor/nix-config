[package]
name = "www-sebastianrasor-com"
version = "0.1.0"
edition = "2024"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.clippy]
pedantic = "warn"
nursery = "warn"

[dependencies]
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.2"
dispocheck = { version = "0.2.47", default-features = false }
governor = "0.10.4"
hickory-resolver = "0.26.3"
idna = "1.1.0"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "hostname", "ring", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots"] }
mail-parser = "1.0.1"
mailrs-smtp-proto = "1.2.0"
memory-serve = "2.4.0"
psl = "2.1.260"
serviceconf = "0.2.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
axum-test = { version = "21.1.0", default-features = false, features = ["ws"] }

[build-dependencies]
memory-serve = "2.4.0"
