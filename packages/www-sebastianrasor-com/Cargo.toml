[package]
name = "www-sebastianrasor-com"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "warn"
nursery = "warn"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
check-if-email-exists = "0.11.10"
fernet = "0.2.2"
figment = { version = "0.10.19", features = ["env"] }
figment_file_provider_adapter = "0.1.1"
hostname = "0.4.2"
http_encoding_headers = "0.2.0"
lettre = { version = "0.11.23", features = ["serde", "tokio1", "tokio1-native-tls"] }
moka = { version = "0.12.16", features = ["sync"] }
phf = "0.14.0"
problem_details = { version = "0.11.0", features = ["axum"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
brotli = "9.0.0"
flate2 = { version = "1.1.10", features = ["zlib"] }
handlebars = "6.4.4"
hex = "0.4.3"
mime_guess = "2.0.5"
phf_codegen = "0.14.0"
sha2 = "0.11.1"
walkdir = "2.5.0"
zstd = "0.14.3"

