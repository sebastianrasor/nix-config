[package]
name = "www-sebastianrasor-com"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = "warn"
nursery = "warn"

[dependencies]
axum = "0.8.9"
axum-turnstile = "0.1.2"
check-if-email-exists = "0.11.10"
figment = { version = "0.10.19", features = ["env"] }
figment_file_provider_adapter = "0.1.1"
hostname = "0.4.2"
include_dir = "0.7.4"
lettre = { version = "0.11.23", features = ["serde", "tokio1", "tokio1-native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-inline-default = "1.0.3"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
brotli = "9.0.0"
flate2 = "1.1.10"
hex = "0.4.3"
minijinja = "3.0.2"
sha2 = "0.11.1"
walkdir = "2.5.0"
zstd = "0.14.3"

