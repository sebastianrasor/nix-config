<svg fill="none" height="11in" viewBox="0 0 816 1056" width="8.5in" xmlns="http://www.w3.org/2000/svg">
  <style>
    @page {
      size: 8.5in 11in;
      margin: 0;
    }
    svg {
      display: block;
      width: 8.5in;
      height: 11in;

      --packingradius: calc((-1729 + 24 * sqrt(70038)) / 4796);
      --columnspacing: calc((8.5 - (2 * var(--packingradius))) / 4);
      --verticalstagger: calc((11 - (2 * var(--packingradius))) / 9);
    }
    text {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      pointer-events: none;
    }
    #row > use {
      --s: 0;
      x: calc((var(--packingradius) + var(--c) * var(--columnspacing)) * 96px);
      y: calc((var(--packingradius) + var(--s) * var(--verticalstagger)) * 96px);
    }
    #row > use:nth-child(even) {
      --s: 1;
    }
    svg > use {
      y: calc(2 * var(--r) * var(--verticalstagger) * 96px);
    }
  </style>

  <defs>
    <g id="rings">
      <!-- 4 Ring -->
      <circle fill="black" style="r: calc(var(--packingradius) * 96px);" />
      <text x="-0.881914765in" font-family="Atkinson Hyperlegible" font-size="6pt" text-anchor="middle" dominant-baseline="middle" fill="white">
        4
      </text>
      <!-- 5 Ring -->
      <circle fill="white" r="0.8in" />
      <text x="-0.7in" font-family="Atkinson Hyperlegible" font-size="6pt" text-anchor="middle" dominant-baseline="middle" fill="black">
        5
      </text>
      <!-- 6 Ring -->
      <circle fill="white" r="0.595in" stroke="black" stroke-width="0.01in" />
      <text x="-0.5125in" font-family="Atkinson Hyperlegible" font-size="6pt" text-anchor="middle" dominant-baseline="middle" fill="black">
        6
      </text>
      <!-- 7 Ring -->
      <circle fill="white" r="0.42in" stroke="black" stroke-width="0.01in" />
      <text x="-0.35in" font-family="Atkinson Hyperlegible" font-size="6pt" text-anchor="middle" dominant-baseline="middle" fill="black">
        7
      </text>
      <!-- 8 Ring -->
      <circle fill="black" r="0.275in" />
      <text x="-0.2125in" font-family="Atkinson Hyperlegible" font-size="6pt" text-anchor="middle" dominant-baseline="middle" fill="white">
        8
      </text>
      <!-- 9 Ring -->
      <circle fill="white" r="0.15in" />
      <text x="-0.1in" font-family="Atkinson Hyperlegible" font-size="6pt" text-anchor="middle" dominant-baseline="middle" fill="black">
        9
      </text>
      <!-- 10 Ring -->
      <circle fill="white" r="0.045in" stroke="black" stroke-width="0.01in" />
    </g>

    <g id="row">
      <use href="#rings" style="--c: 0;" />
      <use href="#rings" style="--c: 1;" />
      <use href="#rings" style="--c: 2;" />
      <use href="#rings" style="--c: 3;" />
      <use href="#rings" style="--c: 4;" />
    </g>
  </defs>

  <use href="#row" style="--r: 0;" />
  <use href="#row" style="--r: 1;" />
  <use href="#row" style="--r: 2;" />
  <use href="#row" style="--r: 3;" />
  <use href="#row" style="--r: 4;" />
</svg>

